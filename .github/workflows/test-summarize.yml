name: Test - Full Pipeline

on:
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch_news.py
        run: python scripts/fetch_news.py

      - name: Run summarize.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize.py

      - name: Run build_epub.py
        run: python scripts/build_epub.py

      - name: List generated EPUB
        run: ls -la docs/briefs/

      - name: Upload EPUB as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-brief-epub
          path: docs/briefs/*.epub
